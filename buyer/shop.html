<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
  <style>
    table {
      width: 70%;
      margin-left: 15%;
    }
  </style>
</head>
<body class="buyer">
  <div id="navbar" data-role="buyer"></div>
  <br>
  <h2>Available Products</h2>
  <div id="productsTable"></div>
  <div id="shopMsg"></div>
  <script>
    function fetchProducts() {
      fetch('shop.php')
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById('productsTable').innerHTML = `<span style='color:red;'>${data.message}</span>`;
            return;
          }
          let html = `<table border='1' cellpadding='10'><tr><th>Name</th><th>Price</th><th>Stock</th><th>Quantity</th><th>Action</th></tr>`;
          data.products.forEach(product => {
            html += `<tr>
              <td>${product.name}</td>
              <td>₹${product.price}</td>
              <td>${product.quantity}</td>
              <td><input type='number' min='1' max='${product.quantity}' value='1' id='qty_${product.product_id}'></td>
              <td><button onclick='addToCart(${product.product_id}, ${product.quantity})'>Add to Cart</button></td>
            </tr>`;
          });
          html += `</table>`;
          document.getElementById('productsTable').innerHTML = html;
        });
    }

    function addToCart(productId, maxQty) {
      const qty = parseInt(document.getElementById('qty_' + productId).value);
      if (qty < 1 || qty > maxQty) {
        document.getElementById('shopMsg').innerHTML = `<span style='color:red;'>Invalid quantity.</span>`;
        return;
      }
      const data = new FormData();
      data.append('product_id', productId);
      data.append('quantity', qty);
      fetch('cart.php', {
        method: 'POST',
        body: data
      })
      .then(res => res.json())
      .then(result => {
    if (result.success) {
      alert("Product added to cart successfully!"); // ✅ Popup for success
    } else {
      alert("Failed to add product: " + result.message); // ✅ Popup for failure
    }
  })
  .catch(err => alert("Error: " + err));
    }

    fetchProducts();
  </script>
  <div id="footer"></div>
</body>
</html>
