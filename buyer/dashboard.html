<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Buyer Dashboard - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
</head>

<body class="buyer">
  <div id="sidebar-container" data-role="buyer"></div>
  <br><br>
  
  <main class="dashboard-shell">

    <section class="stat-grid" aria-label="Buyer dashboard statistics">
      <article class="stat-card">
        <div>
          <div class="stat-label">Cart Items</div>
          <div class="stat-value" id="cartItems">--</div>
          <p class="stat-help">Products currently waiting in your cart.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="totalOrders">--</div>
          <p class="stat-help">Orders placed through Fresh Cart.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Pending Orders</div>
          <div class="stat-value" id="pendingOrders">--</div>
          <p class="stat-help">Orders still awaiting seller confirmation.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Recent Activity</div>
          <ul class="activity-list" id="recentActivity">
            <li>Loading marketplace activity...</li>
          </ul>
        </div>
      </article>
    </section>

    <br>

    <nav class="quick-actions" aria-label="Quick actions">
      <a class="btn" href="shop.html">Browse Products</a>
      <a class="btn" href="cart.html">Open Cart</a>
      <a class="btn" href="orders.html">Order History</a>
    </nav>
  </main>

  <script>
    const formatNumber = value => Number.isFinite(value) ? value : 0;

    Promise.allSettled([
      fetch('cart.php').then(res => res.json()),
      fetch('orders.php').then(res => res.json())
    ]).then(([cartResult, ordersResult]) => {
      const cartData = cartResult.status === 'fulfilled' && cartResult.value.success ? cartResult.value.cart || [] : [];
      const ordersData = ordersResult.status === 'fulfilled' && ordersResult.value.success ? ordersResult.value.orders || [] : [];
      const cartItems = cartData.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      const pendingOrders = ordersData.filter(order => order.status === 'pending').length;

      document.getElementById('cartItems').textContent = formatNumber(cartItems);
      document.getElementById('totalOrders').textContent = formatNumber(ordersData.length);
      document.getElementById('pendingOrders').textContent = formatNumber(pendingOrders);

      const recent = [];
      if (cartItems > 0) recent.push(`${cartItems} fresh item${cartItems === 1 ? '' : 's'} ready for checkout`);
      if (ordersData.length > 0) recent.push(`Latest order status: ${ordersData[0].status}`);
      if (pendingOrders > 0) recent.push(`${pendingOrders} order${pendingOrders === 1 ? '' : 's'} pending seller review`);
      if (recent.length === 0) recent.push('Start shopping to build your first fresh cart');

      document.getElementById('recentActivity').innerHTML = recent.slice(0, 3).map(item => `<li>${item}</li>`).join('');
    });
  </script>

  <div id="footer"></div>
</body>

</html>
