<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Orders - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
  <style>
    table {
      width: 80%;
      margin-left: 10%;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body class="buyer">
  <div id="sidebar-container" data-role="buyer"></div>
  <br>
  <h2>My Orders</h2>
  <div id="ordersTable"></div>

  <script>
    function fetchOrders() {
      fetch('orders.php')
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById('ordersTable').innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">⚠️</div>
                <h3>Unable to Load Orders</h3>
                <p>${data.message}</p>
              </div>`;
            return;
          }
          if (data.orders.length === 0) {
            document.getElementById('ordersTable').innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <h3>No Orders Placed Yet</h3>
                <p>You haven't placed any orders yet. Head over to the shop to browse fresh fruits and vegetables!</p>
              </div>`;
            return;
          }
          let html = `<table>
                        <tr><th>Order ID</th><th>Total</th><th>Status</th><th>Details</th><th>Action</th></tr>`;
          data.orders.forEach(order => {
            let actionHtml = '';
            let statusBadge = `<span style="padding: 6px 12px; border-radius: 6px; font-weight: 600;`;
            
            if (order.status === 'pending') {
              statusBadge += `background: #fef3c7; color: #92400e;">⏳ Pending</span>`;
              actionHtml = `<button onclick='cancelOrder(${order.order_id})' style="background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>`;
            } else if (order.status === 'confirmed') {
              statusBadge += `background: #bfdbfe; color: #1e3a8a;">✓ Confirmed</span>`;
              actionHtml = `<span style="color: #059669; font-weight: 600;">Processing</span>`;
            } else if (order.status === 'delivered') {
              statusBadge += `background: #dcfce7; color: #166534;">✔ Delivered</span>`;
              actionHtml = `<span style="color: #059669; font-weight: 600;">Completed</span>`;
            } else if (order.status === 'cancelled') {
              statusBadge += `background: #fee2e2; color: #991b1b;">✕ Cancelled</span>`;
              actionHtml = `<span style="color: #dc2626; font-weight: 600;">--</span>`;
            } else {
              statusBadge += `background: #e5e7eb; color: #374151;">Status</span>`;
              actionHtml = `<span>--</span>`;
            }
            
            html += `<tr id="row_${order.order_id}">
                      <td>${order.order_id}</td>
                      <td>₹${order.total_amount}</td>
                      <td>${statusBadge}</td>
                      <td><a href='order_details.php?id=${order.order_id}'>View</a></td>
                      <td>${actionHtml}</td>
                    </tr>`;
          });
          html += `</table>`;
          document.getElementById('ordersTable').innerHTML = html;
        });
    }

    function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      const data = new FormData();
      data.append('order_id', orderId);
      data.append('cancel', 1);

      fetch('orders.php', {
        method: 'POST',
        body: data
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            alert("Order cancelled successfully!");
            const row = document.getElementById(`row_${orderId}`);
            if (row) row.remove();
          } else {
            alert("Failed to cancel order: " + result.message);
          }
        })
        .catch(() => {
          alert("Error cancelling order.");
        });
    }

    fetchOrders();
  </script>
  <div id="footer"></div>
</body>

</html>
