<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Cart - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
  <style>
    table {
      width: 80%;
      margin-left: 10%;
    }
  </style>
</head>

<body class="buyer">
  <div id="sidebar-container" data-role="buyer"></div>
  <br>
  <div id="cartTable"></div>
  <div id="cartMsg"></div>
  <script>
    function fetchCart() {
      fetch('cart.php')
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById('cartTable').innerHTML = `<div class="empty-state"><div class="empty-state-icon"></div><h3>Error Loading Cart</h3><p>${data.message}</p></div>`;
            return;
          }
          if (!data.cart || data.cart.length === 0) {
            document.getElementById('cartTable').innerHTML = `<div class="empty-state"><div class="empty-state-icon"></div><h3>No Items in Cart Yet</h3><p>Your cart is empty. Head over to the shop to add fresh fruits and vegetables!</p></div>`;
            return;
          }
          let html = `<table><tr><th>Product</th><th>Quantity</th><th>Price</th><th>Total</th><th>Action</th></tr>`;
          let total = 0;
          data.cart.forEach(item => {
            let lineTotal = item.price * item.quantity;
            total += lineTotal;
            html += `<tr>
              <td>${item.name}</td>
              <td><input type='number' min='1' value='${item.quantity}' id='qty_${item.product_id}'></td>
              <td>₹${item.price}</td>
              <td>₹${lineTotal}</td>
              <td><button onclick='removeFromCart(${item.product_id})'>Remove</button></td>
            </tr>`;
          });
          html += `<tr><td colspan='3'><b>Total</b></td><td>₹${total}</td><td></td></tr>`;
          html += `</table><br><a style="text-align: center; display: inline-block; padding: 10px 28px; background: #4f8a5b; color: #fff; border-radius: 8px; font-weight: 500; text-decoration: none;" href='checkout.html'>Proceed to Checkout</a>`;
          document.getElementById('cartTable').innerHTML = html;
        });
    }

    function removeFromCart(productId) {
      const data = new FormData();
      data.append('product_id', productId);
      data.append('remove', 1);
      fetch('cart.php', {
        method: 'POST',
        body: data
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            alert("Product removed from cart successfully!");
            alert("Failed to remove product: " + result.message);
          }
          fetchCart();
        })
        .catch(() => {
          alert("Error removing product from cart.");
        });
    }

    fetchCart();
  </script>
  <div id="footer"></div>
</body>

</html>
