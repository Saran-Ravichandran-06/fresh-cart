<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
</head>
<body class="common">
  <div class="form-container">
  <div class="form-box">
  <h2>Welcome to Fresh Cart</h2>
  <p style="text-align: center; color: #6b7280; margin-bottom: 20px;">Login to your account</p>
  <form action="login.php" method="POST">
    <label>Role:</label>
    <select name="role" required>
      <option value="buyer">Buyer</option>
      <option value="seller">Seller</option>
    </select><br><br>

    <label>Email:</label>
    <input type="email" name="email" required><br><br>

    <label>Password:</label>
    <input type="password" name="password" required><br><br>

    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
  </div>
</body>
</html>
