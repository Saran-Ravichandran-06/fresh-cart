<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
</head>
<body class="common">
  <div class="form-container">
  <div class="form-box">
  <h2>Join Fresh Cart</h2>
  <p style="text-align: center; color: #6b7280; margin-bottom: 20px;">Create your account</p>
  <form action="register.php" method="POST">
    <label>Full Name:</label>
    <input type="text" name="name" required>

    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Password:</label>
    <input type="password" name="password" required>

    <label>Role:</label>
    <select name="role" required>
      <option value="buyer">Buyer</option>
      <option value="seller">Seller</option>
    </select>

    <div style="text-align: center;">
      <button type="submit" style="width: auto; min-width: 120px;">Register</button>
    </div>
  </form>
  <p style="margin-top: 20px;">Already have an account? <a href="login.html">Login</a></p>
  </div>
  </div>
</body>
</html>
