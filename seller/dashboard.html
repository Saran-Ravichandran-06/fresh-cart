<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Seller Dashboard - Fruit & Veggie Store</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
</head>

<body class="seller">
  <div id="sidebar-container" data-role="seller"></div>

  <main class="dashboard-shell">

    <section class="stat-grid" aria-label="Seller dashboard statistics">
      <article class="stat-card">
        <div>
          <div class="stat-label">Products Listed</div>
          <div class="stat-value" id="productCount">--</div>
          <p class="stat-help">Active fruit and vegetable listings.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="totalOrders">--</div>
          <p class="stat-help">Customer orders received by your store.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Pending Orders</div>
          <div class="stat-value" id="pendingOrders">--</div>
          <p class="stat-help">Orders waiting for confirmation or delivery.</p>
        </div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">Recent Activity</div>
          <ul class="activity-list" id="recentActivity">
            <li>Loading store activity...</li>
          </ul>
        </div>
      </article>
    </section>

    <br>

    <nav class="quick-actions" aria-label="Quick actions">
      <a class="btn" href="add_product.html">Add Product</a>
      <a class="btn" href="edit_product.html">Manage Products</a>
      <a class="btn" href="orders.html">Orders Received</a>
    </nav>
  </main>

  <script>
    const formatNumber = value => Number.isFinite(value) ? value : 0;

    Promise.allSettled([
      fetch('edit_product.php').then(res => res.json()),
      fetch('orders.php').then(res => res.json())
    ]).then(([productsResult, ordersResult]) => {
      const products = productsResult.status === 'fulfilled' && productsResult.value.success ? productsResult.value.products || [] : [];
      const orders = ordersResult.status === 'fulfilled' && ordersResult.value.success ? ordersResult.value.orders || [] : [];
      const pendingOrders = orders.filter(order => order.status === 'pending').length;
      const lowStock = products.filter(product => Number(product.quantity || 0) <= 5).length;

      document.getElementById('productCount').textContent = formatNumber(products.length);
      document.getElementById('totalOrders').textContent = formatNumber(orders.length);
      document.getElementById('pendingOrders').textContent = formatNumber(pendingOrders);

      const recent = [];
      if (orders.length > 0) recent.push(`Latest order: ${orders[0].product || 'Fresh produce'} (${orders[0].status})`);
      if (pendingOrders > 0) recent.push(`${pendingOrders} order${pendingOrders === 1 ? '' : 's'} need attention`);
      if (lowStock > 0) recent.push(`${lowStock} listing${lowStock === 1 ? '' : 's'} running low on stock`);
      if (recent.length === 0) recent.push('Add products to start receiving marketplace orders');

      document.getElementById('recentActivity').innerHTML = recent.slice(0, 3).map(item => `<li>${item}</li>`).join('');
    });
  </script>

  <div id="footer"></div>
</body>

</html>
