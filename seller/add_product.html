<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="/fruit_veggie_store/assets/css/style.css">
  <script src="/fruit_veggie_store/assets/js/navbar.js" defer></script>
</head>

<body class="seller">
  <div id="sidebar-container" data-role="seller"></div>
  
  <div class="form-container">
    <div class="form-box">
      <form id="addProductForm">
        <label>Product Name:</label>
        <input type="text" name="name" required><br>

        <label>Category:</label>
        <select name="category" required>
          <option value="fruit">Fruit</option>
          <option value="vegetable">Vegetable</option>
        </select><br>

        <label>Price:</label>
        <input type="number" step="0.01" name="price" min="0" required><br>

        <label>Quantity:</label>
        <input type="number" name="quantity" min="0" required><br><br>
        <div style="text-align: center;">
          <button type="submit" style="width: auto; min-width: 120px;">Add Product</button>
        </div>
      </form>
    </div>
  </div>
  <div id="addProductMsg"></div>
  <script>
    document.getElementById('addProductForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      fetch('add_product.php', {
        method: 'POST',
        body: data
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            alert("Product added successfully!");
          } else {
            alert("Failed to add product: " + result.message);
          }
        })
        .catch(() => {
          document.getElementById('addProductMsg').innerHTML = `<span style='color:red;'>Error adding product.</span>`;
        });
    });
  </script>
  <div id="footer"></div>
</body>

</html>
